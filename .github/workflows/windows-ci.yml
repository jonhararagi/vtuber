name: Windows CI
on:
  push:
    branches: ["main","migration/**"]
  pull_request:
    branches: ["main"]
jobs:
  build-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"
    - name: Restore solution
      run: dotnet restore VtuberBot.sln
    - name: Build Release
      run: dotnet build VtuberBot.sln --configuration Release --no-restore
    - name: Run automated tests
      run: dotnet test VtuberBot.sln --configuration Release --no-build
    - name: Publish self-contained Windows x64 validation package
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $publishDir = Join-Path $env:RUNNER_TEMP "vtuberbot-publish"
        $packageDir = Join-Path $env:RUNNER_TEMP "vtuberbot-package"
        $zipPath = Join-Path $env:RUNNER_TEMP "VTuberBot-V0.2.3-win-x64.zip"
        Remove-Item $publishDir, $packageDir, $zipPath -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path $publishDir, $packageDir | Out-Null

        dotnet publish src/VtuberBot.App/VtuberBot.App.csproj --configuration Release --runtime win-x64 --self-contained true --output $publishDir

        $exe = Join-Path $publishDir "VtuberBot.App.exe"
        if (-not (Test-Path $exe)) { throw "Published application executable not found: $exe" }

        $sha = "${{ github.sha }}"
        $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
        @(
          "VTuber Bot validation package"
          "Milestone: V0.2.3 stabilization candidate (not accepted/released)"
          "Source SHA: $sha"
          "Configuration: Release"
          "Runtime: win-x64"
          "Deployment: self-contained, multi-file"
          "Generated UTC: $builtAt"
          "Build command: dotnet publish src/VtuberBot.App/VtuberBot.App.csproj --configuration Release --runtime win-x64 --self-contained true"
          "Database/log isolation: first-run defaults resolve under the extracted package directory; extract to a new user-writable folder and do not copy an existing config.toml or data directory into it."
          "This package has not received human visual validation."
        ) | Set-Content -Path (Join-Path $publishDir "BUILD-INFO.txt") -Encoding utf8

        Copy-Item -Path (Join-Path $publishDir "*") -Destination $packageDir -Recurse
        Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal

        $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
        try {
          $names = @($archive.Entries | ForEach-Object { $_.FullName })
          if (-not ($names -contains "VtuberBot.App.exe")) { throw "ZIP does not contain VtuberBot.App.exe" }
          if (-not ($names -contains "BUILD-INFO.txt")) { throw "ZIP does not contain BUILD-INFO.txt" }
          $forbidden = @($names | Where-Object { $_ -match '(^|/)(config\.toml|vtuber\.sqlite3|vtuber\.log(\.|$))$' })
          if ($forbidden.Count -gt 0) { throw "Package unexpectedly contains local config/database/log files: $($forbidden -join ', ')" }
          "Validated ZIP entries: $($names.Count)"
          "ZIP size bytes: $((Get-Item $zipPath).Length)"
        }
        finally { $archive.Dispose() }

        "PACKAGE_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Upload temporary validation artifact
      uses: actions/upload-artifact@v4
      with:
        name: VTuberBot-V0.2.3-win-x64-${{ github.sha }}
        path: ${{ runner.temp }}/VTuberBot-V0.2.3-win-x64.zip
        if-no-files-found: error
        retention-days: 14
